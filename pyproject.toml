[project]
name = "bugsigcrew"
version = "0.1.0"
description = "bugsigcrew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.203.0,<1.0.0"
]

[project.scripts]
bugsigcrew = "bugsigcrew.main:run"
run_crew = "bugsigcrew.main:run"
train = "bugsigcrew.main:train"
replay = "bugsigcrew.main:replay"
test = "bugsigcrew.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
